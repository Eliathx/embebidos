<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parqueadero RFID</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 text-white px-6 py-4 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🅿️</span>
      <div>
        <h1 class="text-xl font-bold tracking-tight">Parqueadero RFID</h1>
        <p class="text-slate-400 text-xs">Panel de control · ESP8266 + RC522</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-sm text-slate-400">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-green-400 animate-pulse inline-block"></span>
      <span id="last-update">Actualizando...</span>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Metric cards -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <p class="text-sm text-slate-500 font-medium">Vehículos dentro ahora</p>
        <p id="dentro" class="text-4xl font-bold text-green-600 mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <p class="text-sm text-slate-500 font-medium">Total de registros</p>
        <p id="total" class="text-4xl font-bold text-slate-700 mt-1">0</p>
      </div>
    </div>

    <!-- Error banner -->
    <div id="error-banner" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">
      ⚠️ No se pudo conectar con el backend. Reintentando...
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-semibold text-slate-700">Registro de accesos</h2>
        <span class="text-xs text-slate-400">Auto-refresh cada 3 s</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wide">
            <tr>
              <th class="px-4 py-3 text-left">#</th>
              <th class="px-4 py-3 text-left">Nombre</th>
              <th class="px-4 py-3 text-left">UID</th>
              <th class="px-4 py-3 text-left">Entrada</th>
              <th class="px-4 py-3 text-left">Salida</th>
              <th class="px-4 py-3 text-left">Duración (min)</th>
              <th class="px-4 py-3 text-left">Estado</th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-100">
            <tr>
              <td colspan="7" class="px-4 py-8 text-center text-slate-400">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString("es-AR", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    function statusBadge(status) {
      if (status === "dentro") {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700">
                  <span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> Dentro
                </span>`;
      }
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-500">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-400 inline-block"></span> Fuera
              </span>`;
    }

    async function load() {
      try {
        const data = await (await fetch("/sessions")).json();

        document.getElementById("total").textContent = data.length;
        document.getElementById("dentro").textContent = data.filter(r => r.status === "dentro").length;
        document.getElementById("error-banner").classList.add("hidden");
        document.getElementById("status-dot").className = "w-2 h-2 rounded-full bg-green-400 animate-pulse inline-block";

        const tbody = document.getElementById("rows");
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">Sin registros todavía.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map((r, i) => `
          <tr class="${i % 2 === 0 ? "bg-white" : "bg-slate-50"} hover:bg-slate-100 transition-colors">
            <td class="px-4 py-3 text-slate-400">${r.id}</td>
            <td class="px-4 py-3 font-medium text-slate-700">${r.name ?? "?"}</td>
            <td class="px-4 py-3 font-mono text-slate-500 text-xs">${r.uid}</td>
            <td class="px-4 py-3 text-slate-600">${formatDate(r.entry_time)}</td>
            <td class="px-4 py-3 text-slate-600">${formatDate(r.exit_time)}</td>
            <td class="px-4 py-3 text-slate-600">${r.duration_min != null ? r.duration_min : "—"}</td>
            <td class="px-4 py-3">${statusBadge(r.status)}</td>
          </tr>`).join("");

      } catch (_) {
        document.getElementById("error-banner").classList.remove("hidden");
        document.getElementById("status-dot").className = "w-2 h-2 rounded-full bg-red-400 inline-block";
      } finally {
        const now = new Date().toLocaleTimeString("es-AR");
        document.getElementById("last-update").textContent = `Última actualización: ${now}`;
      }
    }

    load();
    setInterval(load, 3000);
  </script>

</body>
</html>
